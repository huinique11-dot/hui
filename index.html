<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🥬 우리집 냉장고</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <!-- Tesseract.js: client-side OCR for receipt scanning -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background-color: #f4faf6;
      background-image: radial-gradient(#d9f2e3 1px, transparent 1px);
      background-size: 18px 18px;
    }
    .font-title { font-family: 'Jua', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #e6f5eb; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #6ee7b7; border-radius: 10px; }
    .star-btn { transition: transform 0.1s; }
    .star-btn:active { transform: scale(1.2); }
    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.2s ease-out forwards; }
    input[type="date"] { -webkit-appearance: none; }
  </style>
</head>
<body class="min-h-screen text-gray-800 pb-12">

  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-emerald-200 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🥬</span>
        <span class="font-title text-xl text-emerald-700 tracking-wide">우리집 냉장고</span>
      </div>
      <span class="text-[11px] text-emerald-500 font-semibold" id="header-date"></span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4">

    <div class="flex bg-emerald-100/70 p-1 rounded-2xl mb-4 border border-emerald-200 sticky top-[57px] z-20">
      <button id="tab-btn-fridge" onclick="switchTab('fridge')" class="flex-1 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all">🧊 냉장고</button>
      <button id="tab-btn-log" onclick="switchTab('log')" class="flex-1 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all">📅 집밥로그</button>
      <button id="tab-btn-menu" onclick="switchTab('menu')" class="flex-1 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all">📖 메뉴판</button>
    </div>

    <!-- ===================== VIEW: 냉장고 ===================== -->
    <div id="view-fridge" class="space-y-4">

      <section class="bg-white rounded-3xl p-5 shadow-sm border-2 border-emerald-200 pop-in">
        <h2 class="font-title text-lg text-emerald-700 mb-2 flex items-center gap-1.5"><span>📷</span> 영수증으로 한번에 담기</h2>
        <p class="text-xs text-gray-500 mb-3">영수증 사진을 찍거나 선택하면 품목을 자동으로 인식해드려요.</p>
        <label class="block w-full text-center bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-2xl shadow-md cursor-pointer transition active:scale-95">
          📸 영수증 사진 선택 / 촬영
          <input type="file" accept="image/*" capture="environment" id="receipt-input" class="hidden" onchange="handleReceiptFile(event)">
        </label>
        <div id="ocr-progress" class="hidden mt-3">
          <div class="w-full bg-emerald-100 h-2.5 rounded-full overflow-hidden">
            <div id="ocr-progress-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width:0%"></div>
          </div>
          <p id="ocr-progress-text" class="text-[11px] text-emerald-600 mt-1 font-semibold">인식 준비 중...</p>
        </div>
      </section>

      <section id="pending-review" class="hidden bg-white rounded-3xl p-5 shadow-sm border-2 border-amber-300 pop-in">
        <h2 class="font-title text-lg text-amber-600 mb-1 flex items-center gap-1.5"><span>🔍</span> 인식된 품목 확인</h2>
        <p class="text-xs text-gray-500 mb-3">이름을 수정하고, 필요없는 항목은 지운 뒤 소비기한을 입력해주세요.</p>
        <div id="pending-list" class="space-y-2 max-h-80 overflow-y-auto custom-scrollbar pr-1"></div>
        <div class="flex gap-2 mt-3">
          <button onclick="cancelPending()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 rounded-xl transition">취소</button>
          <button onclick="confirmAddPending()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl transition active:scale-95">냉장고에 담기</button>
        </div>
      </section>

      <section class="bg-white rounded-3xl p-5 shadow-sm border-2 border-emerald-200 pop-in">
        <h2 class="font-title text-lg text-emerald-700 mb-3 flex items-center gap-1.5"><span>✍️</span> 직접 추가하기</h2>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input type="text" id="manual-name" placeholder="품목명 (예: 계란)" class="col-span-2 text-sm px-3 py-2 border border-emerald-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-300 bg-emerald-50/30">
          <select id="manual-category" class="text-xs px-2 py-2 border border-emerald-200 rounded-xl bg-emerald-50/30 focus:outline-none focus:ring-2 focus:ring-emerald-300">
            <option value="채소">🥦 채소</option>
            <option value="과일">🍎 과일</option>
            <option value="육류">🥩 육류</option>
            <option value="수산물">🐟 수산물</option>
            <option value="유제품">🥛 유제품</option>
            <option value="냉동/가공">🧊 냉동/가공</option>
            <option value="기타">📦 기타</option>
          </select>
          <input type="date" id="manual-expiry" class="text-xs px-2 py-2 border border-emerald-200 rounded-xl bg-emerald-50/30 focus:outline-none focus:ring-2 focus:ring-emerald-300">
        </div>
        <button onclick="addManualItem()" class="w-full bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold py-2.5 rounded-xl transition active:scale-95">+ 냉장고에 추가</button>
      </section>

      <section class="bg-white rounded-3xl p-5 shadow-sm border-2 border-emerald-200 pop-in">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-title text-lg text-emerald-700 flex items-center gap-1.5"><span>🧾</span> 보관 중인 재료 <span id="fridge-count" class="text-xs text-emerald-400">(0)</span></h2>
        </div>
        <div class="flex gap-2 mb-3">
          <button onclick="copySelectedItems()" id="btn-copy-selected" disabled class="flex-1 text-xs font-bold bg-gray-100 text-gray-400 py-2 rounded-xl transition disabled:cursor-not-allowed">📋 선택 재료 복사 (<span id="selected-count">0</span>)</button>
          <button onclick="searchRecipeForSelected()" id="btn-search-selected" disabled class="flex-1 text-xs font-bold bg-gray-100 text-gray-400 py-2 rounded-xl transition disabled:cursor-not-allowed">🔎 레시피 검색하기</button>
        </div>
        <div id="fridge-list" class="space-y-2"></div>
      </section>

    </div>

    <!-- ===================== VIEW: 집밥로그 ===================== -->
    <div id="view-log" class="space-y-4 hidden">

      <section class="bg-white rounded-3xl p-5 shadow-sm border-2 border-emerald-200 pop-in">
        <div class="flex items-center justify-between mb-3">
          <button onclick="changeMonth(-1)" class="text-emerald-500 font-bold px-3 py-1 rounded-lg hover:bg-emerald-50">◀</button>
          <h2 id="calendar-title" class="font-title text-lg text-emerald-700"></h2>
          <button onclick="changeMonth(1)" class="text-emerald-500 font-bold px-3 py-1 rounded-lg hover:bg-emerald-50">▶</button>
        </div>
        <div class="grid grid-cols-7 text-center text-[11px] font-bold text-gray-400 mb-1">
          <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
      </section>

      <section class="bg-white rounded-3xl p-5 shadow-sm border-2 border-emerald-200 pop-in">
        <div class="flex items-center justify-between mb-3">
          <h2 id="day-detail-title" class="font-title text-lg text-emerald-700">📅 날짜를 선택하세요</h2>
          <button onclick="toggleAddLogForm()" id="btn-toggle-add-log" class="text-xs font-bold bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-full transition">+ 기록 추가</button>
        </div>

        <div id="add-log-form" class="hidden space-y-2 mb-4 bg-emerald-50/50 p-3 rounded-2xl border border-emerald-100">
          <input type="text" id="log-name" placeholder="요리명 (예: 김치찌개)" class="w-full text-sm px-3 py-2 border border-emerald-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-300">
          <input type="url" id="log-link" placeholder="레시피 링크 (선택, https://...)" class="w-full text-sm px-3 py-2 border border-emerald-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-300">
          <div class="flex items-center gap-1" id="log-star-input"></div>
          <div class="flex gap-2">
            <input type="text" id="log-tag-input" placeholder="주재료 태그 입력 후 Enter (예: 돼지고기)" onkeydown="if(event.key==='Enter'){event.preventDefault();addLogTag();}" class="flex-1 text-xs px-3 py-2 border border-emerald-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-300">
            <button onclick="addLogTag()" class="text-xs font-bold bg-emerald-100 text-emerald-700 px-3 rounded-xl">추가</button>
          </div>
          <div id="log-tag-chips" class="flex flex-wrap gap-1"></div>
          <textarea id="log-memo" rows="2" placeholder="메모 (선택)" class="w-full text-xs p-2.5 border border-emerald-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-emerald-300"></textarea>
          <div class="flex gap-2 pt-1">
            <button onclick="toggleAddLogForm()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-500 font-bold py-2 rounded-xl text-sm">취소</button>
            <button onclick="submitCookLog()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 rounded-xl text-sm active:scale-95">저장</button>
          </div>
        </div>

        <div id="day-detail-list" class="space-y-2"></div>
      </section>

    </div>

    <!-- ===================== VIEW: 메뉴판 ===================== -->
    <div id="view-menu" class="space-y-4 hidden">
      <section class="bg-white rounded-3xl p-5 shadow-sm border-2 border-emerald-200 pop-in">
        <h2 class="font-title text-lg text-emerald-700 mb-3 flex items-center gap-1.5"><span>📖</span> 우리집 메뉴판</h2>
        <div class="flex bg-emerald-50 p-1 rounded-xl border border-emerald-100 mb-3">
          <button id="sort-btn-rating" onclick="setMenuSort('rating')" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition">⭐ 별점순</button>
          <button id="sort-btn-name" onclick="setMenuSort('name')" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition">가 이름순</button>
          <button id="sort-btn-tag" onclick="setMenuSort('tag')" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition">🏷️ 태그별</button>
        </div>
        <div id="menu-tag-filters" class="hidden flex flex-wrap gap-1.5 mb-3"></div>
        <div id="menu-list" class="space-y-3"></div>
      </section>
    </div>

  </main>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 max-w-[90vw] text-center">
    <span id="toast-msg"></span>
  </div>

  <script>
    /* ===================== State & persistence ===================== */
    let fridgeItems = [];   // {id, name, category, expiry, addedAt, checked}
    let cookLogs = [];      // {id, date, name, link, rating, tags:[], memo}
    let pendingItems = [];  // items parsed from receipt awaiting confirmation

    function loadState() {
      fridgeItems = JSON.parse(localStorage.getItem('fridge_items_v1') || '[]');
      cookLogs = JSON.parse(localStorage.getItem('cook_logs_v1') || '[]');
    }
    function saveFridge() { localStorage.setItem('fridge_items_v1', JSON.stringify(fridgeItems)); }
    function saveLogs() { localStorage.setItem('cook_logs_v1', JSON.stringify(cookLogs)); }

    function uid() { return Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

    function pad(n) { return String(n).padStart(2, '0'); }
    function toISODate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

    /* ===================== Tabs ===================== */
    function switchTab(name) {
      ['fridge', 'log', 'menu'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== name);
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === name) {
          btn.className = "flex-1 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all bg-white text-emerald-700 shadow-sm";
        } else {
          btn.className = "flex-1 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all text-emerald-400 hover:text-emerald-600";
        }
      });
      if (name === 'fridge') renderFridgeList();
      if (name === 'log') { renderCalendar(); renderDayDetail(); }
      if (name === 'menu') renderMenuBoard();
    }

    /* ===================== Fridge: receipt OCR ===================== */
    async function handleReceiptFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const progressWrap = document.getElementById('ocr-progress');
      const bar = document.getElementById('ocr-progress-bar');
      const text = document.getElementById('ocr-progress-text');
      progressWrap.classList.remove('hidden');
      bar.style.width = '0%';
      text.innerText = '이미지 불러오는 중...';

      try {
        const result = await Tesseract.recognize(file, 'kor+eng', {
          logger: (m) => {
            if (m.status === 'recognizing text') {
              const pct = Math.round((m.progress || 0) * 100);
              bar.style.width = pct + '%';
              text.innerText = `품목 인식 중... ${pct}%`;
            } else if (m.status) {
              text.innerText = m.status;
            }
          }
        });
        const items = parseReceiptText(result.data.text);
        progressWrap.classList.add('hidden');
        e.target.value = '';
        if (items.length === 0) {
          showToast('영수증에서 품목을 찾지 못했어요. 직접 추가해주세요 🙏');
          return;
        }
        const defaultExpiry = new Date();
        defaultExpiry.setDate(defaultExpiry.getDate() + 7);
        pendingItems = items.map(name => ({
          tempId: uid(),
          name,
          category: '기타',
          expiry: toISODate(defaultExpiry)
        }));
        renderPendingReview();
        showToast(`${items.length}개 품목을 인식했어요! 확인 후 담아주세요 ✅`);
      } catch (err) {
        progressWrap.classList.add('hidden');
        showToast('인식에 실패했어요. 사진을 다시 시도해주세요.');
      }
    }

    // Heuristic parser: receipts are noisy OCR text, so we strip trailing
    // prices/quantities and drop lines that are clearly not item names.
    function parseReceiptText(rawText) {
      const excludeKeywords = ['합계', '부가세', '과세', '면세', '받을금액', '거스름', '카드', '현금', '승인',
        '가맹점', '사업자', '대표', '전화', 'TEL', '영수증', '포인트', '할인', '매장', '주소', '품명', '수량',
        '금액', '바코드', '고객', '거래', '일시', '번호', 'NO.', '결제', '잔액', '적립', '방문', '감사'];

      const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
      const candidates = [];
      const seen = new Set();

      for (let line of lines) {
        const upper = line.toUpperCase();
        if (excludeKeywords.some(k => upper.includes(k.toUpperCase()))) continue;

        // strip trailing price/quantity numbers e.g. "우유 1,000원", "계란 2 3000"
        let cleaned = line
          .replace(/[\d,]{2,}\s*원?\s*$/g, '')
          .replace(/^\s*\d+\s*[.)]\s*/, '')
          .replace(/\s{2,}\d+\s*$/, '')
          .replace(/[*#=~\-_]{2,}/g, '')
          .trim();

        // drop leftover pure numbers/symbols or too-short fragments
        if (!/[가-힣a-zA-Z]/.test(cleaned)) continue;
        if (cleaned.length < 2 || cleaned.length > 20) continue;

        const key = cleaned.replace(/\s/g, '');
        if (seen.has(key)) continue;
        seen.add(key);
        candidates.push(cleaned);
        if (candidates.length >= 25) break;
      }
      return candidates;
    }

    function renderPendingReview() {
      const wrap = document.getElementById('pending-review');
      const list = document.getElementById('pending-list');
      if (pendingItems.length === 0) {
        wrap.classList.add('hidden');
        return;
      }
      wrap.classList.remove('hidden');
      list.innerHTML = pendingItems.map(item => `
        <div class="flex items-center gap-2 bg-amber-50/60 border border-amber-100 rounded-xl p-2">
          <input type="text" value="${escapeHtml(item.name)}" onchange="updatePendingField('${item.tempId}','name',this.value)" class="flex-1 min-w-0 text-sm px-2 py-1.5 border border-amber-200 rounded-lg bg-white">
          <input type="date" value="${item.expiry}" onchange="updatePendingField('${item.tempId}','expiry',this.value)" class="text-xs px-1.5 py-1.5 border border-amber-200 rounded-lg bg-white w-[128px]">
          <button onclick="removePending('${item.tempId}')" class="text-gray-300 hover:text-red-500 text-sm px-1">✕</button>
        </div>
      `).join('');
    }

    function updatePendingField(tempId, field, value) {
      const item = pendingItems.find(p => p.tempId === tempId);
      if (item) item[field] = value;
    }

    function removePending(tempId) {
      pendingItems = pendingItems.filter(p => p.tempId !== tempId);
      renderPendingReview();
    }

    function cancelPending() {
      pendingItems = [];
      renderPendingReview();
    }

    function confirmAddPending() {
      if (pendingItems.length === 0) return;
      pendingItems.forEach(p => {
        fridgeItems.push({
          id: uid(), name: p.name.trim() || '이름없음', category: p.category,
          expiry: p.expiry || '', addedAt: toISODate(new Date()), checked: false
        });
      });
      saveFridge();
      showToast(`${pendingItems.length}개 품목을 냉장고에 담았어요! 🧊`);
      pendingItems = [];
      renderPendingReview();
      renderFridgeList();
    }

    /* ===================== Fridge: manual add & list ===================== */
    function addManualItem() {
      const nameInput = document.getElementById('manual-name');
      const name = nameInput.value.trim();
      const category = document.getElementById('manual-category').value;
      const expiry = document.getElementById('manual-expiry').value;
      if (!name) { showToast('품목명을 입력해주세요.'); return; }
      fridgeItems.push({ id: uid(), name, category, expiry, addedAt: toISODate(new Date()), checked: false });
      saveFridge();
      nameInput.value = '';
      document.getElementById('manual-expiry').value = '';
      renderFridgeList();
      showToast(`'${name}' 추가되었어요! 🥗`);
    }

    function dDayInfo(expiry) {
      if (!expiry) return { label: '기한 미설정', cls: 'bg-gray-100 text-gray-400', days: Infinity };
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const exp = new Date(expiry + 'T00:00:00');
      const days = Math.round((exp - today) / 86400000);
      if (days < 0) return { label: `만료 ${Math.abs(days)}일 경과`, cls: 'bg-red-100 text-red-600', days };
      if (days === 0) return { label: 'D-Day 오늘까지!', cls: 'bg-red-100 text-red-600', days };
      if (days <= 3) return { label: `D-${days}`, cls: 'bg-orange-100 text-orange-600', days };
      if (days <= 7) return { label: `D-${days}`, cls: 'bg-amber-100 text-amber-600', days };
      return { label: `D-${days}`, cls: 'bg-emerald-100 text-emerald-600', days };
    }

    function renderFridgeList() {
      const container = document.getElementById('fridge-list');
      const sorted = [...fridgeItems].sort((a, b) => {
        const da = a.expiry ? dDayInfo(a.expiry).days : Infinity;
        const db = b.expiry ? dDayInfo(b.expiry).days : Infinity;
        return da - db;
      });
      document.getElementById('fridge-count').innerText = `(${fridgeItems.length})`;

      if (sorted.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-gray-400"><span class="text-3xl">🧺</span><p class="text-xs mt-2">냉장고가 비어있어요. 영수증을 스캔하거나 직접 추가해보세요!</p></div>`;
      } else {
        container.innerHTML = sorted.map(item => {
          const d = dDayInfo(item.expiry);
          return `
          <div class="flex items-center gap-2 p-2.5 rounded-xl border ${item.checked ? 'bg-emerald-50 border-emerald-300' : 'bg-gray-50/60 border-gray-100'} transition">
            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItemCheck('${item.id}')" class="w-4.5 h-4.5 accent-emerald-500 cursor-pointer">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-sm font-medium truncate">${escapeHtml(item.name)}</span>
                <span class="text-[10px] text-gray-400 shrink-0">#${item.category}</span>
              </div>
              <input type="date" value="${item.expiry || ''}" onchange="updateExpiry('${item.id}', this.value)" class="text-[11px] text-gray-400 border-0 p-0 bg-transparent mt-0.5 focus:outline-none">
            </div>
            <span class="text-[10px] font-bold px-2 py-1 rounded-lg shrink-0 ${d.cls}">${d.label}</span>
            <button onclick="deleteFridgeItem('${item.id}')" class="text-gray-300 hover:text-red-500 text-sm px-1 shrink-0">✕</button>
          </div>`;
        }).join('');
      }

      const selectedCount = fridgeItems.filter(i => i.checked).length;
      document.getElementById('selected-count').innerText = selectedCount;
      const copyBtn = document.getElementById('btn-copy-selected');
      const searchBtn = document.getElementById('btn-search-selected');
      [copyBtn, searchBtn].forEach(btn => {
        btn.disabled = selectedCount === 0;
        btn.className = selectedCount === 0
          ? "flex-1 text-xs font-bold bg-gray-100 text-gray-400 py-2 rounded-xl transition disabled:cursor-not-allowed"
          : "flex-1 text-xs font-bold bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded-xl transition active:scale-95";
      });
    }

    function toggleItemCheck(id) {
      const item = fridgeItems.find(i => i.id === id);
      if (item) { item.checked = !item.checked; saveFridge(); renderFridgeList(); }
    }

    function updateExpiry(id, value) {
      const item = fridgeItems.find(i => i.id === id);
      if (item) { item.expiry = value; saveFridge(); renderFridgeList(); }
    }

    function deleteFridgeItem(id) {
      fridgeItems = fridgeItems.filter(i => i.id !== id);
      saveFridge();
      renderFridgeList();
    }

    function getSelectedNames() {
      return fridgeItems.filter(i => i.checked).map(i => i.name);
    }

    function copySelectedItems() {
      const names = getSelectedNames();
      if (names.length === 0) return;
      copyToClipboardText(names.join(', '));
    }

    function searchRecipeForSelected() {
      const names = getSelectedNames();
      if (names.length === 0) return;
      copyToClipboardText(names.join(', '));
      const query = encodeURIComponent(names.join(' ') + ' 레시피');
      window.open(`https://search.naver.com/search.naver?query=${query}`, '_blank');
    }

    /* ===================== 집밥로그 (calendar) ===================== */
    let currentMonth = new Date(); currentMonth.setDate(1);
    let selectedDate = toISODate(new Date());
    let logRating = 0;
    let logTags = [];

    function changeMonth(delta) {
      currentMonth.setMonth(currentMonth.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById('calendar-title').innerText = `${currentMonth.getFullYear()}년 ${currentMonth.getMonth() + 1}월`;
      const grid = document.getElementById('calendar-grid');
      const year = currentMonth.getFullYear(), month = currentMonth.getMonth();
      const firstWeekday = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = toISODate(new Date());

      let cells = '';
      for (let i = 0; i < firstWeekday; i++) cells += `<div></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${pad(month + 1)}-${pad(d)}`;
        const entries = cookLogs.filter(l => l.date === dateStr);
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDate;
        let base = "aspect-square flex flex-col items-center justify-center rounded-xl text-xs cursor-pointer transition relative ";
        if (isSelected) base += "bg-emerald-500 text-white font-bold shadow-sm";
        else if (isToday) base += "bg-emerald-50 text-emerald-700 font-bold border border-emerald-300";
        else base += "hover:bg-emerald-50 text-gray-600";
        cells += `
          <div class="${base}" onclick="selectDay('${dateStr}')">
            <span>${d}</span>
            ${entries.length > 0 ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-emerald-400'} mt-0.5"></span>` : ''}
          </div>`;
      }
      grid.innerHTML = cells;
    }

    function selectDay(dateStr) {
      selectedDate = dateStr;
      document.getElementById('add-log-form').classList.add('hidden');
      renderCalendar();
      renderDayDetail();
    }

    function toggleAddLogForm() {
      const form = document.getElementById('add-log-form');
      form.classList.toggle('hidden');
      if (!form.classList.contains('hidden')) {
        document.getElementById('log-name').value = '';
        document.getElementById('log-link').value = '';
        document.getElementById('log-memo').value = '';
        logRating = 0; logTags = [];
        renderStarInput();
        renderLogTagChips();
      }
    }

    function renderStarInput() {
      const wrap = document.getElementById('log-star-input');
      wrap.innerHTML = [1, 2, 3, 4, 5].map(n => `
        <button type="button" class="star-btn text-2xl leading-none" onclick="setLogRating(${n})">${n <= logRating ? '⭐' : '☆'}</button>
      `).join('');
    }
    function setLogRating(n) { logRating = n; renderStarInput(); }

    function addLogTag() {
      const input = document.getElementById('log-tag-input');
      const val = input.value.trim();
      if (!val) return;
      if (!logTags.includes(val)) logTags.push(val);
      input.value = '';
      renderLogTagChips();
    }
    function removeLogTag(idx) { logTags.splice(idx, 1); renderLogTagChips(); }
    function renderLogTagChips() {
      document.getElementById('log-tag-chips').innerHTML = logTags.map((t, i) => `
        <span class="text-[11px] bg-emerald-100 text-emerald-700 px-2 py-1 rounded-full flex items-center gap-1">
          #${escapeHtml(t)} <button onclick="removeLogTag(${i})" class="text-emerald-400 hover:text-emerald-700">✕</button>
        </span>
      `).join('');
    }

    function submitCookLog() {
      const name = document.getElementById('log-name').value.trim();
      const link = document.getElementById('log-link').value.trim();
      const memo = document.getElementById('log-memo').value.trim();
      if (!name) { showToast('요리명을 입력해주세요.'); return; }
      cookLogs.push({ id: uid(), date: selectedDate, name, link, rating: logRating, tags: [...logTags], memo });
      saveLogs();
      document.getElementById('add-log-form').classList.add('hidden');
      renderCalendar();
      renderDayDetail();
      showToast(`'${name}' 기록을 저장했어요! 🍚`);
    }

    function deleteCookLog(id) {
      cookLogs = cookLogs.filter(l => l.id !== id);
      saveLogs();
      renderCalendar();
      renderDayDetail();
    }

    function renderStars(rating) {
      return [1, 2, 3, 4, 5].map(n => n <= rating ? '⭐' : '☆').join('');
    }

    function renderDayDetail() {
      const [y, m, d] = selectedDate.split('-');
      document.getElementById('day-detail-title').innerText = `📅 ${y}년 ${Number(m)}월 ${Number(d)}일`;
      const entries = cookLogs.filter(l => l.date === selectedDate);
      const list = document.getElementById('day-detail-list');
      if (entries.length === 0) {
        list.innerHTML = `<div class="text-center py-6 text-gray-400"><p class="text-xs">이 날짜에 기록된 집밥이 없어요.</p></div>`;
        return;
      }
      list.innerHTML = entries.map(e => `
        <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-3 space-y-1.5">
          <div class="flex items-start justify-between">
            <div>
              <div class="font-bold text-sm text-gray-800">${escapeHtml(e.name)}</div>
              <div class="text-xs">${renderStars(e.rating)}</div>
            </div>
            <button onclick="deleteCookLog('${e.id}')" class="text-gray-300 hover:text-red-500 text-xs px-1">✕</button>
          </div>
          ${e.tags && e.tags.length ? `<div class="flex flex-wrap gap-1">${e.tags.map(t => `<span class="text-[10px] bg-white text-emerald-600 border border-emerald-200 px-1.5 py-0.5 rounded-full">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${e.link ? `<a href="${escapeAttr(e.link)}" target="_blank" rel="noopener noreferrer" class="inline-block text-[11px] font-bold text-emerald-600 underline">🔗 레시피 보기</a>` : ''}
          ${e.memo ? `<p class="text-xs text-gray-500 bg-white/70 p-2 rounded-lg">${escapeHtml(e.memo)}</p>` : ''}
        </div>
      `).join('');
    }

    /* ===================== 메뉴판 ===================== */
    let menuSortMode = 'rating';
    let menuTagFilter = null;

    function setMenuSort(mode) {
      menuSortMode = mode;
      menuTagFilter = null;
      renderMenuBoard();
    }

    function aggregateMenu() {
      const map = new Map();
      cookLogs.forEach(l => {
        const key = l.name.trim().toLowerCase();
        if (!map.has(key)) {
          map.set(key, { name: l.name.trim(), ratings: [], tags: new Set(), link: l.link, lastDate: l.date, count: 0 });
        }
        const entry = map.get(key);
        entry.ratings.push(l.rating || 0);
        (l.tags || []).forEach(t => entry.tags.add(t));
        entry.count++;
        if (l.date >= entry.lastDate) { entry.lastDate = l.date; if (l.link) entry.link = l.link; }
      });
      return Array.from(map.values()).map(e => ({
        ...e,
        avgRating: e.ratings.length ? e.ratings.reduce((a, b) => a + b, 0) / e.ratings.length : 0,
        tags: Array.from(e.tags)
      }));
    }

    function renderMenuBoard() {
      ['rating', 'name', 'tag'].forEach(m => {
        const btn = document.getElementById(`sort-btn-${m}`);
        btn.className = m === menuSortMode
          ? "flex-1 py-1.5 rounded-lg text-xs font-bold transition bg-white text-emerald-700 shadow-sm"
          : "flex-1 py-1.5 rounded-lg text-xs font-bold transition text-emerald-500 hover:text-emerald-700";
      });

      const menu = aggregateMenu();
      const tagFilterWrap = document.getElementById('menu-tag-filters');
      const list = document.getElementById('menu-list');

      if (menu.length === 0) {
        tagFilterWrap.classList.add('hidden');
        list.innerHTML = `<div class="text-center py-8 text-gray-400"><span class="text-3xl">🍽️</span><p class="text-xs mt-2">아직 집밥로그가 없어요. 캘린더에서 기록을 추가해보세요!</p></div>`;
        return;
      }

      if (menuSortMode === 'tag') {
        const allTags = Array.from(new Set(menu.flatMap(m => m.tags))).sort((a, b) => a.localeCompare(b, 'ko'));
        tagFilterWrap.classList.remove('hidden');
        tagFilterWrap.innerHTML = ['전체', ...allTags].map(t => {
          const active = (t === '전체' && !menuTagFilter) || t === menuTagFilter;
          return `<button onclick="setMenuTagFilter(${t === '전체' ? 'null' : `'${escapeAttr(t)}'`})" class="text-[11px] font-bold px-2.5 py-1 rounded-full border transition ${active ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-white text-emerald-600 border-emerald-200'}">#${escapeHtml(t)}</button>`;
        }).join('');
      } else {
        tagFilterWrap.classList.add('hidden');
      }

      let filtered = menu;
      if (menuSortMode === 'tag' && menuTagFilter) {
        filtered = filtered.filter(m => m.tags.includes(menuTagFilter));
      }

      if (menuSortMode === 'rating') {
        filtered = [...filtered].sort((a, b) => b.avgRating - a.avgRating || a.name.localeCompare(b.name, 'ko'));
      } else {
        filtered = [...filtered].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
      }

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-6 text-gray-400"><p class="text-xs">해당 태그의 메뉴가 없어요.</p></div>`;
        return;
      }

      list.innerHTML = filtered.map(m => `
        <div class="bg-emerald-50/40 border border-emerald-100 rounded-2xl p-3 space-y-1.5">
          <div class="flex items-start justify-between">
            <div>
              <div class="font-bold text-sm text-gray-800">${escapeHtml(m.name)}</div>
              <div class="text-xs">${renderStars(Math.round(m.avgRating))} <span class="text-gray-400 text-[10px]">(${m.avgRating.toFixed(1)} · ${m.count}회 조리)</span></div>
            </div>
          </div>
          ${m.tags.length ? `<div class="flex flex-wrap gap-1">${m.tags.map(t => `<span class="text-[10px] bg-white text-emerald-600 border border-emerald-200 px-1.5 py-0.5 rounded-full">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          <div class="flex items-center justify-between pt-0.5">
            <span class="text-[10px] text-gray-400">최근 조리: ${m.lastDate}</span>
            ${m.link ? `<a href="${escapeAttr(m.link)}" target="_blank" rel="noopener noreferrer" class="text-[11px] font-bold text-emerald-600 underline">🔗 레시피 보기</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    function setMenuTagFilter(tag) {
      menuTagFilter = tag;
      renderMenuBoard();
    }

    /* ===================== Utils ===================== */
    function copyToClipboardText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('클립보드에 복사했어요! 이제 레시피를 검색해보세요 📋');
      } catch (err) {
        showToast('복사에 실패했어요.');
      }
      document.body.removeChild(ta);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2600);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
    function escapeAttr(str) { return escapeHtml(str); }

    /* ===================== Init ===================== */
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      document.getElementById('header-date').innerText = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
      switchTab('fridge');
      renderStarInput();
    });
  </script>
</body>
</html>
