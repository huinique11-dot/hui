<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧸 소개팅 남 판독기 (Blind Date Inspector)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Gowun Dodum & Gaegu for cute vibe -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <!-- Canvas Confetti Library for high scores -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background-color: #fff5f7;
      background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .font-cute {
      font-family: 'Gaegu', cursive;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #fce7f3;
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #f472b6;
      border-radius: 10px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in {
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="min-h-screen text-gray-800 pb-12">

  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-pink-200 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl animate-float">🧸</span>
        <span class="font-cute text-2xl font-bold text-pink-600 tracking-wide">소개팅 남 판독기</span>
      </div>
      <button onclick="switchTab('history')" class="relative text-xs font-bold text-pink-600 bg-pink-100 hover:bg-pink-200 px-3 py-1.5 rounded-full transition flex items-center gap-1 shadow-sm">
        📜 기록함
        <span id="history-badge" class="bg-pink-500 text-white text-[10px] px-1.5 py-0.2 rounded-full hidden">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4">

    <div class="flex bg-pink-100/70 p-1 rounded-2xl mb-4 border border-pink-200">
      <button id="tab-btn-check" onclick="switchTab('check')" class="flex-1 py-2 rounded-xl font-bold text-sm transition-all bg-white text-pink-600 shadow-sm">
        🔍 판독 체크
      </button>
      <button id="tab-btn-history" onclick="switchTab('history')" class="flex-1 py-2 rounded-xl font-bold text-sm transition-all text-pink-400 hover:text-pink-600">
        💌 저장된 리포트
      </button>
    </div>

    <!-- VIEW 1: CHECKLIST FORM -->
    <div id="view-check" class="space-y-4">

      <section class="bg-white rounded-3xl p-5 shadow-sm border-2 border-pink-200 pop-in">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-cute text-xl font-bold text-pink-600 flex items-center gap-1.5">
            <span>✨</span> 누구와의 소개팅인가요?
          </h2>
          <button onclick="resetCurrentForm()" class="text-xs text-gray-400 hover:text-pink-500 underline">
            초기화
          </button>
        </div>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-gray-500 mb-1 font-semibold">상대방 별명 / 이름</label>
            <input type="text" id="target-name" placeholder="예: 강남역 카페남, L씨" class="w-full text-sm px-3 py-2 border border-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300 bg-pink-50/30">
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1 font-semibold">만난 날짜</label>
            <input type="date" id="target-date" class="w-full text-sm px-3 py-2 border border-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300 bg-pink-50/30">
          </div>
        </div>
      </section>

      <section class="bg-gradient-to-r from-pink-400 via-rose-400 to-purple-400 rounded-3xl p-5 text-white shadow-md relative overflow-hidden pop-in">
        <div class="absolute -right-4 -bottom-4 opacity-10 text-8xl select-none">💖</div>
        <div class="relative z-10 flex items-center justify-between">
          <div>
            <span class="text-xs font-bold bg-white/20 px-2.5 py-0.5 rounded-full text-pink-100">검증 점수 리포트</span>
            <div class="mt-1 flex items-baseline gap-1">
              <span id="score-num" class="text-4xl font-extrabold tracking-tight">0</span>
              <span class="text-pink-200 font-semibold text-lg">/ <span id="total-num">10</span>점</span>
            </div>
            <div id="grade-badge" class="inline-block mt-2 px-3 py-1 bg-white text-pink-600 text-xs font-bold rounded-xl shadow-sm">
              체크박스를 선택해보세요! 
            </div>
          </div>
          <div class="text-right">
            <div id="verdict-emoji" class="text-5xl mb-1 animate-bounce">🤔</div>
            <div id="pass-rate" class="text-xs font-medium text-pink-100">달성률 0%</div>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-white/30 h-2.5 rounded-full mt-4 overflow-hidden p-0.5">
          <div id="progress-bar" class="bg-white h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
      </section>

      <section class="bg-white rounded-3xl p-5 shadow-sm border-2 border-pink-200 space-y-4 pop-in">
        <div class="flex items-center justify-between border-b border-pink-100 pb-2">
          <h2 class="font-cute text-xl font-bold text-pink-600 flex items-center gap-1.5">
            <span>🔍</span> 매너 & 인성 체크리스트
          </h2>
          <span class="text-xs text-pink-400 font-medium">솔직하게 체크해주세요</span>
        </div>

        <div id="checklist-container" class="space-y-3">
          <!-- Dynamically inserted by JS -->
        </div>

        <div class="pt-2 border-t border-pink-100">
          <label class="block text-xs font-semibold text-pink-500 mb-1.5">➕ 나만의 체크 항목 추가하기</label>
          <div class="flex gap-2">
            <input type="text" id="custom-input" placeholder="예: 첫 만남에 과도한 스킨십을 안 하는가?" class="flex-1 text-xs px-3 py-2 border border-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300">
            <button onclick="addCustomQuestion()" class="bg-pink-500 hover:bg-pink-600 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow-sm active:scale-95">
              추가
            </button>
          </div>
        </div>
      </section>

      <section class="bg-white rounded-3xl p-5 shadow-sm border-2 border-pink-200 pop-in">
        <h2 class="font-cute text-xl font-bold text-pink-600 mb-2 flex items-center gap-1.5">
          <span>📝</span> 특별히 기억에 남는 점 (메모)
        </h2>
        <textarea id="target-notes" rows="3" placeholder="그 사람이 했던 말, 감동 포인트, 혹은 찝찝했던 신호(Red Flag)를 기록해두세요." class="w-full text-xs p-3 border border-pink-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-300 resize-none bg-pink-50/20"></textarea>
      </section>

      <section class="flex gap-2 pt-2">
        <button onclick="saveToHistory()" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-bold py-3.5 px-4 rounded-2xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
          <span>💾</span> 판독 결과 저장하기
        </button>
        <button onclick="copySummaryToClipboard()" class="bg-pink-100 hover:bg-pink-200 text-pink-600 font-bold py-3.5 px-4 rounded-2xl transition transform active:scale-95 flex items-center justify-center gap-1">
          <span>📋</span> 세부 요약 복사
        </button>
      </section>

    </div>

    <!-- VIEW 2: SAVED HISTORY LIST -->
    <div id="view-history" class="space-y-4 hidden">
      <div class="bg-white rounded-3xl p-5 shadow-sm border-2 border-pink-200">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-cute text-xl font-bold text-pink-600 flex items-center gap-1.5">
            <span>💌</span> 내가 판독한 소개팅 남 목록
          </h2>
          <button onclick="clearAllHistory()" class="text-xs text-red-400 hover:text-red-600 underline">
            전체 삭제
          </button>
        </div>
        <p class="text-xs text-gray-500 mb-4">비교해보고 가장 괜찮은 남자에게 애프터 신청을 승낙해보세요!</p>

        <div id="history-container" class="space-y-3">
          <!-- Dynamically generated list -->
        </div>
      </div>
    </div>

  </main>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/85 text-white text-xs px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
    <span id="toast-msg">메시지 내용</span>
  </div>

  <script>
    /* Default core criteria questions carefully crafted for checking date quality */
    const defaultQuestions = [
      { id: 1, text: "식당, 카페 직원분들에게 반말 안 하고 친절히 대한다 ☕", category: "기본매너" },
      { id: 2, text: "내 말을 건성으로 듣지 않고 귀기울여 들으며 질문한다 👂", category: "대화" },
      { id: 3, text: "약속 시간을 지키거나, 늦더라도 미리 예의있게 상황을 알렸다 ⏰", category: "기본매너" },
      { id: 4, text: "메뉴나 장소 결정 시 내 취향과 편의를 먼저 물어보고 배려한다 🍰", category: "배려심" },
      { id: 5, text: "전 연인에 대한 불필요한 비하나 자랑을 하지 않는다 🙅‍♀️", category: "인성" },
      { id: 6, text: "재력, 차, 인맥 등 과도한 허세나 자뻑이 없다 🚘", category: "겸손함" },
      { id: 7, text: "음식이 늦거나 상황이 꼬여도 쉽게 짜증내지 않고 유연하다 🌿", category: "감정조절" },
      { id: 8, text: "대화 티키타카가 잘 되고 나를 웃게 만들어준다 🎉", category: "유머/호감" },
      { id: 9, text: "과도한 유흥, 도박, 과음 등 레드플래그 취미 신호가 없다 ⚽", category: "생활패턴" },
      { id: 10, text: "헤어진 후 매너 있게 잘 들어갔는지 안부 인사 및 애프터를 표한다 💌", category: "애프터" }
    ];

    let currentQuestions = [...defaultQuestions];
    let checkedState = {};

    window.addEventListener('DOMContentLoaded', () => {
      // Set default date to today
      const dateInput = document.getElementById('target-date');
      if (dateInput) {
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
      }

      renderChecklist();
      updateHistoryBadge();
    });

    function switchTab(tabName) {
      const viewCheck = document.getElementById('view-check');
      const viewHistory = document.getElementById('view-history');
      const tabBtnCheck = document.getElementById('tab-btn-check');
      const tabBtnHistory = document.getElementById('tab-btn-history');

      if (tabName === 'check') {
        viewCheck.classList.remove('hidden');
        viewHistory.classList.add('hidden');
        tabBtnCheck.className = "flex-1 py-2 rounded-xl font-bold text-sm transition-all bg-white text-pink-600 shadow-sm";
        tabBtnHistory.className = "flex-1 py-2 rounded-xl font-bold text-sm transition-all text-pink-400 hover:text-pink-600";
      } else {
        viewCheck.classList.add('hidden');
        viewHistory.classList.remove('hidden');
        tabBtnHistory.className = "flex-1 py-2 rounded-xl font-bold text-sm transition-all bg-white text-pink-600 shadow-sm";
        tabBtnCheck.className = "flex-1 py-2 rounded-xl font-bold text-sm transition-all text-pink-400 hover:text-pink-600";
        renderHistoryList();
      }
    }

    function renderChecklist() {
      const container = document.getElementById('checklist-container');
      container.innerHTML = '';

      currentQuestions.forEach((q) => {
        const isChecked = !!checkedState[q.id];
        const item = document.createElement('div');
        item.className = `p-3 rounded-2xl transition border flex items-start gap-3 cursor-pointer ${
          isChecked ? 'bg-pink-50 border-pink-300 shadow-sm' : 'bg-gray-50/70 border-gray-100 hover:bg-pink-50/40'
        }`;
        
        item.onclick = (e) => {
          // Prevent double trigger when clicking input directly
          if (e.target.tagName !== 'INPUT') {
            toggleCheck(q.id);
          }
        };

        item.innerHTML = `
          <div class="pt-0.5">
            <input type="checkbox" id="chk-${q.id}" ${isChecked ? 'checked' : ''} onchange="toggleCheck(${q.id})" class="w-5 h-5 text-pink-500 rounded-md accent-pink-500 cursor-pointer">
          </div>
          <div class="flex-1">
            <label for="chk-${q.id}" class="text-xs sm:text-sm font-medium text-gray-800 leading-snug cursor-pointer select-none">
              ${q.text}
            </label>
            <span class="inline-block mt-1 text-[10px] text-pink-500 font-semibold bg-pink-100 px-2 py-0.5 rounded-md">
              #${q.category || '기타'}
            </span>
          </div>
        `;
        container.appendChild(item);
      });

      calculateScore();
    }

    function toggleCheck(id) {
      checkedState[id] = !checkedState[id];
      renderChecklist();
    }

    function calculateScore() {
      const totalCount = currentQuestions.length;
      const checkedCount = currentQuestions.filter(q => checkedState[q.id]).length;
      const ratio = totalCount > 0 ? (checkedCount / totalCount) : 0;
      const percentage = Math.round(ratio * 100);

      document.getElementById('score-num').innerText = checkedCount;
      document.getElementById('total-num').innerText = totalCount;
      document.getElementById('pass-rate').innerText = `달성률 ${percentage}%`;
      document.getElementById('progress-bar').style.width = `${percentage}%`;

      const gradeBadge = document.getElementById('grade-badge');
      const verdictEmoji = document.getElementById('verdict-emoji');

      if (checkedCount === 0) {
        gradeBadge.innerText = "체크 항목을 눌러 검증해보세요!";
        gradeBadge.className = "inline-block mt-2 px-3 py-1 bg-white/80 text-pink-600 text-xs font-bold rounded-xl shadow-sm";
        verdictEmoji.innerText = "🤔";
      } else if (ratio >= 0.9) {
        gradeBadge.innerText = "💖 [천상계 벤츠남] 당장 놓치지 마세요!!";
        gradeBadge.className = "inline-block mt-2 px-3 py-1 bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-sm";
        verdictEmoji.innerText = "👑";
        triggerConfettiOnce();
      } else if (ratio >= 0.7) {
        gradeBadge.innerText = "✨ [우량주 훈남] 적극 애프터 추천해요!";
        gradeBadge.className = "inline-block mt-2 px-3 py-1 bg-pink-500 text-white text-xs font-bold rounded-xl shadow-sm";
        verdictEmoji.innerText = "🥰";
      } else if (ratio >= 0.5) {
        gradeBadge.innerText = "⚠️ [무난한 보통남] 한 번 더 만나볼 만해요.";
        gradeBadge.className = "inline-block mt-2 px-3 py-1 bg-amber-400 text-gray-900 text-xs font-bold rounded-xl shadow-sm";
        verdictEmoji.innerText = "🧐";
      } else if (ratio >= 0.3) {
        gradeBadge.innerText = "🚨 [주의 필요남] 찝찝한 신호를 재점검하세요!";
        gradeBadge.className = "inline-block mt-2 px-3 py-1 bg-orange-500 text-white text-xs font-bold rounded-xl shadow-sm";
        verdictEmoji.innerText = "😰";
      } else {
        gradeBadge.innerText = "🛑 [위험! 탈출구 확보] 총알 회피 필수!";
        gradeBadge.className = "inline-block mt-2 px-3 py-1 bg-red-600 text-white text-xs font-bold rounded-xl shadow-sm";
        verdictEmoji.innerText = "🏃‍♀️";
      }
    }

    let confettiTriggered = false;
    function triggerConfettiOnce() {
      if (!confettiTriggered && typeof confetti === 'function') {
        confetti({
          particleCount: 70,
          spread: 60,
          origin: { y: 0.6 }
        });
        confettiTriggered = true;
      }
    }

    function addCustomQuestion() {
      const input = document.getElementById('custom-input');
      const val = input.value.trim();
      if (!val) {
        showToast("추가할 항목 내용을 입력해주세요!");
        return;
      }

      const newId = Date.now();
      currentQuestions.push({
        id: newId,
        text: val,
        category: "나만의기준"
      });
      checkedState[newId] = true; // Auto check newly added custom rule

      input.value = '';
      renderChecklist();
      showToast("새로운 검증 항목이 추가되었습니다! 🎯");
    }

    function resetCurrentForm() {
      if (confirm("입력한 내용을 모두 초기화할까요?")) {
        checkedState = {};
        document.getElementById('target-name').value = '';
        document.getElementById('target-notes').value = '';
        confettiTriggered = false;
        renderChecklist();
        showToast("초기화 되었습니다.");
      }
    }

    function saveToHistory() {
      const name = document.getElementById('target-name').value.trim() || '이름 없음';
      const date = document.getElementById('target-date').value || new Date().toISOString().split('T')[0];
      const notes = document.getElementById('target-notes').value.trim();

      const totalCount = currentQuestions.length;
      const checkedQuestions = currentQuestions.filter(q => checkedState[q.id]);
      const uncheckedQuestions = currentQuestions.filter(q => !checkedState[q.id]);
      const checkedCount = checkedQuestions.length;
      const ratio = totalCount > 0 ? (checkedCount / totalCount) : 0;
      const percentage = Math.round(ratio * 100);

      let verdictTitle = "보통남";
      if (ratio >= 0.9) verdictTitle = "💖 천상계 벤츠남";
      else if (ratio >= 0.7) verdictTitle = "✨ 우량주 훈남";
      else if (ratio >= 0.5) verdictTitle = "⚠️ 보통남";
      else if (ratio >= 0.3) verdictTitle = "🚨 주의 필요남";
      else verdictTitle = "🛑 탈출 권장남";

      const record = {
        id: Date.now(),
        name,
        date,
        notes,
        score: checkedCount,
        total: totalCount,
        percentage,
        verdictTitle,
        checkedTexts: checkedQuestions.map(q => q.text),
        uncheckedTexts: uncheckedQuestions.map(q => q.text)
      };

      const history = getHistory();
      history.unshift(record);
      localStorage.setItem('blind_date_history', JSON.stringify(history));

      updateHistoryBadge();
      showToast(`'${name}'님과의 검증 결과가 저장되었습니다! 💾`);
      switchTab('history');
    }

    function getHistory() {
      const data = localStorage.getItem('blind_date_history');
      return data ? JSON.parse(data) : [];
    }

    function updateHistoryBadge() {
      const history = getHistory();
      const badge = document.getElementById('history-badge');
      if (history.length > 0) {
        badge.innerText = history.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function renderHistoryList() {
      const container = document.getElementById('history-container');
      const history = getHistory();

      if (history.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-gray-400">
            <span class="text-4xl">📭</span>
            <p class="text-xs mt-2">아직 저장된 판독 결과가 없어요.<br>소개팅 후 체크리스트를 작성해보세요!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      history.forEach(item => {
        const checkedList = item.checkedTexts || [];
        const uncheckedList = item.uncheckedTexts || [];
        
        const card = document.createElement('div');
        card.className = "bg-pink-50/50 rounded-2xl p-4 border border-pink-200 shadow-sm relative space-y-3";
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-gray-800 text-sm">${escapeHtml(item.name)}</h3>
                <span class="text-[10px] text-gray-400">${item.date}</span>
              </div>
              <div class="mt-1 font-semibold text-xs text-pink-600">
                ${item.verdictTitle} (${item.score}/${item.total}점 · ${item.percentage}%)
              </div>
            </div>
            <button onclick="deleteHistoryItem(${item.id})" class="text-gray-300 hover:text-red-500 text-xs p-1" title="삭제">
              ✕
            </button>
          </div>

          ${item.notes ? `
            <div class="text-xs bg-white p-2.5 rounded-xl border border-pink-100 text-gray-600">
              <span class="font-bold text-pink-500">메모:</span> ${escapeHtml(item.notes)}
            </div>
          ` : ''}

          <!-- Details Toggle Button -->
          <button onclick="toggleHistoryDetail(${item.id})" class="w-full text-xs font-bold py-1.5 px-3 bg-pink-100/70 hover:bg-pink-200/70 text-pink-700 rounded-xl transition flex items-center justify-between">
            <span id="detail-btn-text-${item.id}">🔍 세부 검증 항목 보기</span>
            <span id="detail-btn-arrow-${item.id}">▼</span>
          </button>

          <!-- Expandable Detail Container -->
          <div id="detail-content-${item.id}" class="hidden space-y-2 pt-1 border-t border-pink-100 text-xs">
            ${checkedList.length > 0 ? `
              <div>
                <div class="font-bold text-emerald-600 mb-1 flex items-center gap-1">
                  <span>✅</span> 만족한 항목 (${checkedList.length}개)
                </div>
                <ul class="space-y-1 pl-1">
                  ${checkedList.map(text => `<li class="text-gray-700 bg-white/80 px-2 py-1 rounded-lg border border-emerald-100">• ${escapeHtml(text)}</li>`).join('')}
                </ul>
              </div>
            ` : ''}

            ${uncheckedList.length > 0 ? `
              <div class="mt-2">
                <div class="font-bold text-rose-500 mb-1 flex items-center gap-1">
                  <span>❌</span> 미흡/아쉬운 항목 (${uncheckedList.length}개)
                </div>
                <ul class="space-y-1 pl-1">
                  ${uncheckedList.map(text => `<li class="text-gray-500 bg-white/50 px-2 py-1 rounded-lg border border-rose-100">• ${escapeHtml(text)}</li>`).join('')}
                </ul>
              </div>
            ` : ''}
          </div>

          <div class="pt-1 flex justify-end">
            <button onclick="copyHistorySummary(${item.id})" class="text-[11px] font-bold text-pink-600 hover:text-pink-700 bg-white px-2.5 py-1 rounded-lg border border-pink-200 shadow-sm flex items-center gap-1">
              <span>📋</span> 세부사항 요약 복사
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleHistoryDetail(id) {
      const content = document.getElementById(`detail-content-${id}`);
      const btnText = document.getElementById(`detail-btn-text-${id}`);
      const btnArrow = document.getElementById(`detail-btn-arrow-${id}`);

      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        btnText.innerText = "🔒 세부 검증 항목 접기";
        btnArrow.innerText = "▲";
      } else {
        content.classList.add('hidden');
        btnText.innerText = "🔍 세부 검증 항목 보기";
        btnArrow.innerText = "▼";
      }
    }

    function deleteHistoryItem(id) {
      let history = getHistory();
      history = history.filter(item => item.id !== id);
      localStorage.setItem('blind_date_history', JSON.stringify(history));
      updateHistoryBadge();
      renderHistoryList();
      showToast("기록이 삭제되었습니다.");
    }

    function clearAllHistory() {
      if (confirm("저장된 모든 소개팅 기록을 삭제할까요?")) {
        localStorage.removeItem('blind_date_history');
        updateHistoryBadge();
        renderHistoryList();
        showToast("모든 기록이 삭제되었습니다.");
      }
    }

    function copySummaryToClipboard() {
      const name = document.getElementById('target-name').value.trim() || '소개팅 남';
      const date = document.getElementById('target-date').value || new Date().toISOString().split('T')[0];
      const totalCount = currentQuestions.length;
      const checkedQuestions = currentQuestions.filter(q => checkedState[q.id]);
      const uncheckedQuestions = currentQuestions.filter(q => !checkedState[q.id]);
      const checkedCount = checkedQuestions.length;
      const percentage = Math.round((checkedCount / totalCount) * 100);
      const notes = document.getElementById('target-notes').value.trim();

      let summaryText = `🧸 [소개팅 남 판독 세부 리포트]\n`;
      summaryText += `• 대상: ${name} (${date})\n`;
      summaryText += `• 검증 점수: ${checkedCount} / ${totalCount}점 (${percentage}%)\n\n`;

      if (checkedQuestions.length > 0) {
        summaryText += `✅ [만족한 항목 (${checkedQuestions.length}개)]\n`;
        checkedQuestions.forEach(q => {
          summaryText += `• ${q.text}\n`;
        });
        summaryText += `\n`;
      }

      if (uncheckedQuestions.length > 0) {
        summaryText += `❌ [미흡/아쉬운 항목 (${uncheckedQuestions.length}개)]\n`;
        uncheckedQuestions.forEach(q => {
          summaryText += `• ${q.text}\n`;
        });
        summaryText += `\n`;
      }

      if (notes) {
        summaryText += `📝 [메모]\n${notes}\n\n`;
      }

      summaryText += `친구야 이 사람 어때? 같이 판독해줘! 💕`;

      copyToClipboardText(summaryText);
    }

    function copyHistorySummary(id) {
      const history = getHistory();
      const item = history.find(h => h.id === id);
      if (!item) return;

      const checkedList = item.checkedTexts || [];
      const uncheckedList = item.uncheckedTexts || [];

      let summaryText = `🧸 [소개팅 남 판독 세부 리포트]\n`;
      summaryText += `• 대상: ${item.name} (${item.date})\n`;
      summaryText += `• 판독 결과: ${item.verdictTitle} (${item.score}/${item.total}점 · ${item.percentage}%)\n\n`;

      if (checkedList.length > 0) {
        summaryText += `✅ [만족한 항목 (${checkedList.length}개)]\n`;
        checkedList.forEach(t => {
          summaryText += `• ${t}\n`;
        });
        summaryText += `\n`;
      }

      if (uncheckedList.length > 0) {
        summaryText += `❌ [미흡/아쉬운 항목 (${uncheckedList.length}개)]\n`;
        uncheckedList.forEach(t => {
          summaryText += `• ${t}\n`;
        });
        summaryText += `\n`;
      }

      if (item.notes) {
        summaryText += `📝 [메모]\n${item.notes}\n\n`;
      }

      summaryText += `판독기에서 작성된 기록입니다 💌`;

      copyToClipboardText(summaryText);
    }

    function copyToClipboardText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast("클립보드에 요약 결과가 복사되었습니다! 📋");
      } catch (err) {
        showToast("복사에 실패했습니다.");
      }
      document.body.removeChild(textarea);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
